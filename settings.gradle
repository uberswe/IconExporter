pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net/')
                }
            }
            filter {
                includeGroupByRegex("net\\.minecraftforge.*")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Parchment'
                    url = uri('https://maven.parchmentmc.org')
                }
            }
            filter {
                includeGroupByRegex("org\\.parchmentmc.*")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Neoforged'
                    url = uri('https://maven.neoforged.net/releases')
                }
            }
            filter {
                includeGroupByRegex("net\\.neoforged.*")
                includeGroup('codechicken')
                includeGroup('net.covers1624')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public/')
                }
            }
            filter {
                includeGroupByRegex("org\\.spongepowered.*")
            }
        }
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "net.minecraftforge.gradle") {
                useModule("${requested.id}:ForgeGradle:${requested.version}")
            }
            if (requested.id.id == "org.spongepowered.mixin") {
                useModule("org.spongepowered:mixingradle:${requested.version}")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Add repositories for Minecraft libraries (needed for Docker/CI builds)
// Loom respects dependencyResolutionManagement for minecraftLibraries configuration
dependencyResolutionManagement {
    repositories {
        // LOCAL LWJGL - populated by download-lwjgl.sh in Docker builds
        // Must be first for Docker builds to find LWJGL
        maven {
            name = 'Local LWJGL Repo'
            url = uri('/iconexporter/local-maven-repo')
            content {
                includeGroupAndSubgroups('org.lwjgl')
            }
        }
        // Mojang's library server - primary source for LWJGL and Minecraft deps
        maven {
            name = 'Mojang Libraries'
            url = 'https://libraries.minecraft.net/'
        }
        mavenCentral()
        maven {
            name = 'Fabric Maven'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'IconExporter'
include('loader-common')
include('loader-fabric')
include('loader-neoforge')
include('loader-forge')
